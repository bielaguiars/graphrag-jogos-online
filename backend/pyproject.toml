[project]
name = "graphrag-kag-arxiv"
version = "1.0.0"
description = "GraphRAG/KAG sobre artigos de IA do arXiv com Neo4j, busca hibrida e Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "neo4j>=5.26",
    "pydantic>=2.9",
    "sentence-transformers>=3.3",
    "streamlit>=1.40",
    "pyvis>=0.3.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["neo4j: precisa do Neo4j rodando (docker compose up -d)"]

[tool.uv]
package = false
